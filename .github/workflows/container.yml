name: Builder image (Ant, Node)

on:
  push:
    # Run tests on every push; publishing is further restricted below to `main`.
    branches:
      - '**'

    # Also run on `v1.2.3` release tags.
    tags:
      - v*

  pull_request:
    branches: [ main ]

  schedule:
    - cron: "5 8 * * 0"

  workflow_dispatch:

env:
  IMAGE_NAME: builder

# Least-privilege default; the `push` job elevates to `packages: write` for GHCR.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run tests.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        JAVA_VERSION: [11, 21]
    steps:
      - uses: actions/checkout@v7

      - name: Make buildkit default
        uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Install bats
        run: sudo apt-get install bats

      - name: Build default images for testing on CI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            JAVA_VERSION=${{ matrix.JAVA_VERSION }}
          load: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Run tests
        run: bats --tap test/*.bats
  push:
    # Ensure test job passes before pushing image. Publishing is restricted to `main`.
    needs: test

    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Make buildkit default
        uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eeditiones/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Login to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/eeditiones/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
