name: Builder image (Ant, Node)

on:
  push:
    # No `branches` filter: runs on every branch push. `tags` below adds
    # `v*` release tags too; publishing itself is restricted below.
    tags:
      - v*

  pull_request:
    branches: [ main ]

  schedule:
    - cron: "5 8 * * 0"

  workflow_dispatch:

env:
  IMAGE_NAME: builder

# Least-privilege default; the `push` job elevates to `packages: write` for GHCR.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run tests.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        JAVA_VERSION: [11, 21]
    steps:
      - uses: actions/checkout@v7

      - name: Make buildkit default
        uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Install bats
        run: sudo apt-get install bats

      - name: Build default images for testing on CI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            JAVA_VERSION=${{ matrix.JAVA_VERSION }}
          load: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Run tests
        run: bats --tap test/*.bats
  push:
    # Ensure test job passes before pushing image. Publishing is restricted to
    # `main` (updates `:latest`) and `v*` release tags (updates the semver tag),
    # whether triggered by an actual push or a manual workflow_dispatch run.
    needs: test

    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Make buildkit default
        uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eeditiones/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
